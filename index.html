<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu SaaS Beleza - Cadastro do Cliente</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #555; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #msg { margin-top: 15px; font-size: 14px; text-align: center; word-break: break-word; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Cadastro do Salão</h2>
    <form id="formCadastro">
      <label>Nome do Salão/Cliente:</label>
      <input type="text" id="name" placeholder="Ex: Yoslane Alves Estetica" required>

      <label>E-mail:</label>
      <input type="email" id="email" placeholder="cliente@email.com" required>

      <label>Telefone / WhatsApp:</label>
      <input type="text" id="phone" placeholder="98981352838" required>

      <button type="submit">Cadastrar no SaaS</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formCadastro');
      
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg');
        msg.innerText = 'Enviando...';
        msg.style.color = '#333';

        const payload = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          planId: "1"
        };

        try {
          const response = await fetch('http://localhost:3000/api/v1/master/tenants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();
          console.log('Resposta do Backend:', data);

          if (response.ok) {
            msg.innerText = '✅ Cadastrado com sucesso!';
            msg.style.color = 'green';
          } else {
            const erroDetalhado = Array.isArray(data.message) 
              ? data.message.join(', ') 
              : (data.message || 'Erro de validação nos campos.');
            msg.innerText = `⚠️ ${erroDetalhado}`;
            msg.style.color = 'red';
          }
        } catch (err) {
          console.error(err);
          msg.innerText = '❌ Erro de conexão com o backend!';
          msg.style.color = 'red';
        }
      });
    });
  </script>

</body>
</html>
