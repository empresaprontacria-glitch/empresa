services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_beauty_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"

  evolution-api:
    image: evolutionapi/evolution-api:v2.1.1
    container_name: saas_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://saas_user:saas_password@postgres:5432/saas_beauty_db
      - AUTHENTICATION_API_KEY=014203Dy***
    depends_on:
      - postgres

volumes:
  pgdata: